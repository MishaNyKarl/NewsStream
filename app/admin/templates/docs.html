{% extends 'base.html' %}{% block content %}<div class="docs-list">{% for name in documents %}<a href="/docs?name={{ name|urlencode }}">{{ name }}</a>{% endfor %}</div>{% if content is not none %}<h2>{{ document }}</h2><pre class="document">{{ content }}</pre>{% else %}<p>Выберите актуальный файл из каталога docs. Markdown показывается безопасным текстом.</p>{% endif %}{% endblock %}
