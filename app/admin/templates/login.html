{% extends 'base.html' %}{% block content %}<section class="login panel"><h2>Вход администратора</h2><p>Мониторинг и обслуживание проекта.</p>
{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Логин<input name="username" required autocomplete="username" maxlength="128"></label>
<label>Пароль<input name="password" type="password" required autocomplete="current-password" maxlength="1024"></label>
<button>Войти</button></form></section>{% endblock %}
