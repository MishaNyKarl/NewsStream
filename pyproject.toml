[project]
name = "news-watch-bot"
version = "0.1.0"
description = "Telegram story development monitoring MVP"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.31.0", "SQLAlchemy==2.0.54", "asyncpg==0.31.0",
  "alembic==1.20.0", "pydantic-settings==2.15.0", "httpx==0.28.1",
  "aiohttp==3.14.3", "beautifulsoup4==4.15.0", "defusedxml==0.7.1"
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.4.0", "aiosqlite==0.22.1", "ruff==0.16.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
