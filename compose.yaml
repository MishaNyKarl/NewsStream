name: newswatch
x-app: &app
  build: .
  image: newswatch:local
  env_file: .env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  mem_limit: 256m
  cpus: 0.7
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    db: {condition: service_healthy}
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newswatch
      POSTGRES_USER: newswatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=30]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U newswatch -d newswatch"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  bot:
    <<: *app
    command: [python, -m, app.main, bot]
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/tmp/newswatch-bot-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<90"]
      interval: 30s
      start_period: 60s
  worker:
    <<: *app
    command: [python, -m, app.main, worker]
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/tmp/newswatch-worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<180"]
      interval: 30s
      start_period: 60s
volumes:
  postgres_data:
